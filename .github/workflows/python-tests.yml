name: A2 Python regression tests
on: [push, pull_request, workflow_dispatch]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify Python sources
        run: python -m compileall -q src
      - name: Install image processing test dependencies
        run: python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
